# This is a reference copy. On the actual deployment machine, this file lives at
# third_party/lerobot_ur5e_keyteleop/scripts/config/cfg.yaml — the relative path
# lookup in run_record.py (parents[1]/config/cfg.yaml) depends on that exact folder
# structure, which is NOT reproduced in custom_code/.

record:
  repo_id: &repo_id "scylearning/test_name"
  # repo_id: &repo_id "scylearning/pick_greencube_into_trashbin" 
  # Suggested format: <hf_username>/<description>, description = task.description -> Verb_SourceObject_prep_TargetObject
  # e.g. Pick up the green cube and put it into the trash bin -> pick_greencube_into_trashbin
  user_notes: "init_pose: [0.392232, 0.104898, 0.355162, -3.14, 0.0, -1.57]; init_pose_range: [0.02, 0.02, 0.02, 0.0, 0.0, 0.0]; force_step_size: 0.04; force_fine_step_size: 0.015; force_rot_step_size: 0.05; force_fine_rot_step_size: 0.045; gripper_force: 20; gripper_speed: 100; description: 'Extinguish the alcohol lamp'" # any additional notes about the dataset
  fps: 30 # dataset and camera frame rate (matched to webcam native 30fps)

  robot:
    ip: &ip "127.0.0.1" # URSim RTDE host
    use_gripper: &use_gripper False # no gripper hardware
    init_gripper: &init_gripper False # skip gripper initialization
    close_threshold: 0.7 # threshold to determine gripper open/close
    gripper_bin_threshold: 0.98 # threshold to determine gripper is closed
    gripper_port: &gripper_port "" # gripper disabled
    gripper_reverse: &gripper_reverse False # If gripper moves opposite, flip this value
    gripper_force: &gripper_force 20 # gripper force command
    gripper_speed: &gripper_speed 100 # gripper speed command
    debug: False # if True, robot will not execute arm actions, but gripper can still be controlled
    control_space: "force" # "position" or "force"
    reference_frame: "tcp" # "base" or "tcp"; tcp_pose fields store EE/flange pose after removing UR TCP offset
    init_pose: [0.392232, 0.104898, 0.355162, -3.14, 0.0, -1.57] # robot reset TCP pose [x, y, z, roll, pitch, yaw] in radians
    init_pose_range: [0.03, 0.03, 0.03, 0.0, 0.0, 0.0] # max random range for reset TCP pose [x, y, z, roll_deg, pitch_deg, yaw_deg]
    force_mode:
      hold_current_pose_on_idle: True # if True, hold the current actual TCP pose when no motion key is pressed
      kp: 1200
      kd: 600
      kp_rot: 2000
      kd_rot: 400
      rtde_freq: 100
      select_vector: [1, 1, 1, 1, 1, 1]
      force_limit: [2, 2, 2, 2, 2, 2]
      pos_delta: 0.048
      vel_delta: 4.0                                                                                                                                                                                                                                                                                                                                                                                    
      gain_scale: 1.5
      control_frame_euler_deg: &control_frame_euler_deg [0, 0, 0] # control frame xyz Euler orientation relative to the robot base, in degrees
    position_mode:
      speed: 0.2 # not used in servoL, only used in reset
      acceleration: 0.2 # not used in servoL, only used in reset
      servo_time: 0.1
      lookahead_time: 0.1
      gain: 300
    payload:
      mass: 1.601
      cog: [0.011, -0.002, 0.052]

  teleop:
    position_step_size: 0.006 # keyboard xyz target delta for position control
    force_step_size: 0.04 # keyboard xyz target delta for force control
    force_fine_step_size: 0.015 # keyboard xyz target delta for force control after / toggle
    position_rot_step_size: 0.02 # keyboard euler angle target delta for position control [rx, ry, rz]
    force_rot_step_size: 0.05 # keyboard euler angle target delta for force control [rx, ry, rz]
    force_fine_rot_step_size: 0.045 # keyboard euler angle target delta for force control after / toggle [rx, ry, rz]
    control_frame_euler_deg: *control_frame_euler_deg

  task:
    description: "test_description" # task description
    num_episodes: 120 # number of episodes to record
    display: True # Whether to display the data during recording
    resume: False
    resume_dataset: scylearning/extinguish_alcohol_lamp_20260801_v01 # dataset to resume from if resume is True

  time:
    episode_time_sec: 600 # max time per episode in seconds
    reset_time_sec: 600 # max time to reset between episodes in seconds
    save_meta_period: 1 # Save metadata after every N episodes

  cameras:
    enabled: True # use real camera(s) via OpenCV
    backend: "pybullet" # "pybullet" for dual rendered views, "opencv" for webcam+render, "realsense" for RealSense hardware
    # NOTE: these two fields are only used when backend is 'opencv' or 'realsense'.
    # They are ignored entirely when backend is 'pybullet' (the current setting).
    wrist_cam_serial: "0" # OpenCV device index (used as wrist camera for now — laptop webcam)
    exterior_cam_serial: "0" # OpenCV device index (same physical webcam, used for exterior slot too)
    width: 640 # camera and dummy-frame width; common values: 640, 424
    height: 480 # camera and dummy-frame height; common values: 480, 360, 240
    dummy_value: 0 # dummy RGB image intensity in [0, 255] (unused when enabled)
    pybullet_urdf_path: "REPLACE_WITH_YOUR_HOME/Documents/ur5e_rlds_project/third_party/ur5e_model/ur5e.urdf" # URDF for rendering wrist_image. Update this path to match your actual project location before running.

  storage:
    push_to_hub: False # whether to push the dataset to your huggingface repo after recording

replay:
  repo_id: *repo_id
  episode_idx: 0 # episode index to replay
  robot:
    ip: *ip
    gripper_port: *gripper_port
    use_gripper: *use_gripper
    init_gripper: *init_gripper
    gripper_reverse: *gripper_reverse
    gripper_force: *gripper_force
    gripper_speed: *gripper_speed
    control_frame_euler_deg: *control_frame_euler_deg

visualize:
  dataset_name: scylearning/extinguish_alcohol_lamp_20260801_v01
  episode_index: 27 # episode index to visualize
  default_obs_group: "tcp_pose" # default observation group shown in the data window
  data_window: True # open a local browser window for per-frame action and selected observation data
  print_to_terminal: False # also print per-frame data to terminal

check_dataset:
  dataset_name: scylearning/test_20260516_v01

prune_episodes:
  old_dataset_name: scylearning/test_20260516_v01
  new_dataset_name: scylearning/test_20260516_v01_pruned
