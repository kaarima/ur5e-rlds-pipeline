name: smoke-test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  wrapper-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Fetch required source trees
        run: |
          mkdir -p third_party
          git clone --depth 1 --branch v0.4.0 --single-branch https://github.com/huggingface/lerobot.git third_party/lerobot
          git clone --depth 1 https://github.com/scy-v/lerobot_ur5e_keyteleop.git third_party/lerobot_ur5e_keyteleop

      - name: Run static smoke test
        run: ./scripts/test_wrapper_smoke.sh
